<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Detalhes do Produto | Square Commerce</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; background: var(--color-white); color: var(--color-navy); }
    :root{--color-navy:#082957;--color-deep-blue:#061C3A;--color-cyan:#20A8D8;--color-white:#F7F9FC;--color-tech-gray:#AAB4C0;}
    header { padding: 1.5rem 2rem; background: var(--color-deep-blue); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.1); }
    header a { color: white; text-decoration: none; font-weight: 500; font-size: 1.05rem; }
    header a:hover { color: var(--color-cyan); }
    
    .container { max-width: 1200px; margin: 4rem auto; padding: 0 20px; }
    .product-wrapper { display: flex; flex-direction: column; gap: 4rem; background: #fff; padding: 3rem; border-radius: 16px; box-shadow: 0 4px 30px rgba(0,0,0,0.05); }
    @media(min-width: 1024px) { .product-wrapper { flex-direction: row; padding: 4rem; } }
    
    .product-gallery { flex: 1; display: flex; align-items: center; justify-content: center; background: #f9f9f9; border-radius: 12px; padding: 3rem; }
    .product-gallery img { max-width: 100%; height: auto; mix-blend-mode: multiply; object-fit: contain; }
    
    .product-details { flex: 1.2; display: flex; flex-direction: column; }
    .category-badge { display: inline-block; padding: 0.5rem 1rem; background: #edf2f7; color: var(--color-navy); font-weight: 700; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; border-radius: 4px; margin-bottom: 1rem; width: fit-content; }
    h1 { font-size: 2.5rem; margin-top: 0; margin-bottom: 1rem; color: var(--color-navy); line-height: 1.2; font-weight: 800; }
    .description { font-size: 1.15rem; color: #555; line-height: 1.7; margin-bottom: 2.5rem; }
    
    .specs-table { width: 100%; border-collapse: collapse; margin-bottom: 2.5rem; }
    .specs-table th, .specs-table td { padding: 1.25rem 0; border-bottom: 1px solid #eaeaea; text-align: left; font-size: 1.05rem; }
    .specs-table th { font-weight: 600; color: var(--color-navy); width: 40%; }
    .specs-table td { color: #555; }
    
    .characteristics { margin-bottom: 3rem; }
    .characteristics h3 { font-size: 1.35rem; margin-bottom: 1.5rem; font-weight: 700; }
    .characteristics ul { list-style: none; padding: 0; margin: 0; }
    .characteristics li { font-size: 1.05rem; color: #444; margin-bottom: 1rem; display: flex; align-items: flex-start; gap: 0.75rem; line-height: 1.5; }
    .characteristics li::before { content: "✓"; color: var(--color-cyan); font-weight: bold; font-size: 1.2rem; }
    
    .cta-container { display: flex; flex-direction: column; gap: 1rem; margin-top: auto; }
    @media(min-width: 768px) { .cta-container { flex-direction: row; } }
    .cta-btn { padding: 1.25rem 2rem; border-radius: 8px; font-weight: 600; text-align: center; text-decoration: none; transition: all 0.3s; font-size: 1.1rem; flex: 1; cursor: pointer; border: none; }
    .cta-primary { background: var(--color-cyan); color: #fff; }
    .cta-primary:hover { background: #1a8ab4; transform: translateY(-2px); box-shadow: 0 4px 15px rgba(32, 168, 216, 0.3); }
    .cta-secondary { background: transparent; border: 2px solid var(--color-navy); color: var(--color-navy); }
    .cta-secondary:hover { background: var(--color-navy); color: #fff; }
    
    #errorMsg { display: none; text-align: center; padding: 5rem; font-size: 1.5rem; color: #999; }
  </style>
</head>
<body>
  <header>
    <a href="index.html" style="font-size: 1.5rem; font-weight: 800; letter-spacing: -0.05em;">SQUARE<span style="color:var(--color-cyan);">COMMERCE</span></a>
    <a href="shop.html">&larr; Voltar para Catálogo</a>
  </header>

  <div class="container">
    <div id="errorMsg">Produto não encontrado. <a href="shop.html" style="color:var(--color-cyan);">Voltar ao catálogo.</a></div>
    
    <div class="product-wrapper" id="productContent" style="display:none;">
      <div class="product-gallery">
        <img id="pImage" src="" alt="Produto">
      </div>
      <div class="product-details">
        <div class="category-badge" id="pCategory"></div>
        <h1 id="pName"></h1>
        <p class="description" id="pDesc"></p>
        
        <div class="characteristics">
          <h3>Características</h3>
          <ul id="pChars"></ul>
        </div>

        <table class="specs-table">
          <tbody>
            <tr><th>Materiais</th><td id="pMaterials"></td></tr>
            <tr><th>Instalação</th><td id="pInstalacao"></td></tr>
            <tr><th>Configuração</th><td id="pConfig"></td></tr>
            <tr><th>Aplicação</th><td id="pAplicacao"></td></tr>
            <tr><th>Acionamento</th><td id="pAcionamento"></td></tr>
          </tbody>
        </table>
        
        <div class="cta-container">
          <a id="btnOrcamento" href="https://wa.me/5582996205266?text=Ol%C3%A1%2C%20gostaria%20de%20solicitar%20um%20or%C3%A7amento" class="cta-btn cta-primary" target="_blank" rel="noopener">Solicitar orçamento</a>
          <a id="btnEspecialista" href="https://wa.me/5582996205266?text=Ol%C3%A1%2C%20gostaria%20de%20falar%20com%20um%20especialista" class="cta-btn cta-secondary" target="_blank" rel="noopener">Falar com especialista</a>
        </div>
      </div>
    </div>
  </div>

  <script src="products.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id');
    
    const product = products.find(p => p.id === productId);
    
    if (!product) {
      document.getElementById('errorMsg').style.display = 'block';
    } else {
      document.getElementById('productContent').style.display = 'flex';
      
      document.getElementById('pImage').src = product.image;
      document.getElementById('pImage').alt = product.name;
      document.getElementById('pCategory').textContent = product.category;
      document.getElementById('pName').textContent = product.name;
      document.getElementById('pDesc').textContent = product.description;
      
      document.getElementById('pChars').innerHTML = product.characteristics.map(c => `<li>${c}</li>`).join('');
      
      document.getElementById('pMaterials').textContent = product.materials;
      document.getElementById('pInstalacao').textContent = product.instalacao;
      document.getElementById('pConfig').textContent = product.configuracao;
      document.getElementById('pAplicacao').textContent = product.aplicacao;
      document.getElementById('pAcionamento').textContent = product.acionamento;

      const productName = encodeURIComponent(product.name);
      document.getElementById('btnOrcamento').href = `https://wa.me/5582996205266?text=Ol%C3%A1%2C%20gostaria%20de%20solicitar%20um%20or%C3%A7amento%20para%20o%20produto%3A%20${productName}`;
      document.getElementById('btnEspecialista').href = `https://wa.me/5582996205266?text=Ol%C3%A1%2C%20gostaria%20de%20falar%20com%20um%20especialista%20sobre%20o%20produto%3A%20${productName}`;
    }
  </script>
</body>
</html>
